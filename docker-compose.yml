
services:

  mongo:
    image: mongo:7
    container_name: student-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./student-backend
    container_name: student-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/studentdb
    depends_on:
      - mongo
    ports:
      - "5000:5000"

  frontend:
    build: ./student-frontend
    container_name: student-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mongo_data:
